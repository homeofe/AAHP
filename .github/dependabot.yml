# Dependabot lanes. An ecosystem that is not named here is not scanned, and the
# absence looks exactly like "there was nothing to update": no pull request is
# opened either way. So the thing to measure is the ECOSYSTEM LIST, never the
# pull-request count.
#
# That is how 22 of this repository's 25 action references sat on mutable major
# tags while the npm lane was visibly working. `scripts/check-workflow-pinning.mjs`
# now asserts that the `github-actions` lane below exists, so deleting it is red
# rather than silent.
#
# Every lane carries the same two settings, and rule K of that gate asserts both
# on every lane:
#
# - `groups:` with a single `"*"` group for version updates. One pull request
#   per ecosystem per week instead of one per dependency. Each dependency pull
#   request re-runs the whole required CI, and the ones that touch a pin other
#   files must follow (the governance template, the scanner policy anchor) all
#   need the same follow-up commit; one grouped pull request takes it once.
#   `applies-to: version-updates` keeps security updates out of the group, so a
#   fix is never held back behind an unrelated version bump.
#
# - `cooldown:` a release must be `default-days` old before Dependabot proposes
#   it. Most malicious package versions are found and pulled within days of
#   publication, and a lane that proposes a release the hour it appears is the
#   fastest route from a compromised upstream into this repository. The cooldown
#   applies to version updates only; GitHub does not delay security updates by
#   it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"

  # Every `uses:` in .github/workflows/ is pinned to a commit SHA, which is the
  # only reference GitHub cannot repoint. A pin with no update lane is not the
  # end state though: it stops moving, including past the fix for whatever the
  # pinned commit turns out to contain. This lane is what moves them. Dependabot
  # rewrites the SHA and the trailing `# vX.Y.Z` comment together, so the
  # human-readable version stays true.
  #
  # `directory: "/"` is the whole repository's workflow directory: for the
  # github-actions ecosystem Dependabot reads `.github/workflows/` under the
  # named directory. assets/governance/aahp-govern.yml is a TEMPLATE, not a
  # workflow directory, so this lane does not reach it. Rule H of the pinning
  # gate therefore requires every action the template uses to sit at the SHA
  # the workflows use: a pull request from this lane that moves one of them is
  # red until the template moves in the same pull request (ADR-021).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    # One group for every action, which also covers the case that made this
    # lane need a group first. Dependabot treats every SUB-PATH of an action
    # repository as a separate dependency, so github/codeql-action/init,
    # /autobuild and /analyze each got their own pull request, and codeql-action
    # refuses to run when its steps are not on the same version: each
    # single-path pull request failed with "Not all workflow steps that use
    # github/codeql-action actions use the same version". Measured on #96, #98
    # and #99, all three correct and all three individually unmergeable.
    #
    # `scripts/check-workflow-pinning.mjs` rule G fails if any action used through
    # more than one sub-path is left ungrouped, so narrowing the pattern below is
    # red rather than silent - and it covers the next multi-path action too, not
    # just this one.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
