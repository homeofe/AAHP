name: "CodeQL"

# A floor for the file, declared rather than inherited: without it every job here
# takes the repository's default_workflow_permissions, which is a SETTING and can
# widen this workflow with no diff here to review.
#
# The analyze job below carries its own block, and a job-level `permissions:`
# REPLACES the top-level one rather than merging with it, so this line does not
# reduce what analyze gets and deleting analyze's block as "redundant" would drop
# the security-events: write grant its SARIF upload needs. Both facts are held by
# gates: tests/assert-workflow-hardening.mjs requires this block, and
# tests/assert-repo-ci-shape.mjs requires analyze's.
permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CodeQL uploads its SARIF over the API, not over git, so the job has
          # no use for the checkout credential. See the header.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          category: "/language:${{ matrix.language }}"

