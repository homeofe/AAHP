# aahp-govern.yml - Portable AAHP governance gate for consumer repositories.
#
# Drop this into .github/workflows/ (or let `aahp init --gates` scaffold it) to
# run the AAHP governance gates on every push and pull request. It invokes the
# gates through the pinned @elvatis_com/aahp devDependency via `npx --no-install`,
# so there are no vendored script paths to maintain. Verify-only: it never
# mutates the repository, and it honors no skip or bypass environment variable.
#
# This workflow runs NO handoff-integrity gate, and neither of its two steps
# stands in for one. `aahp check` runs the config-driven governance gates only:
# it has no file-set gate and no index gate. `aahp doctor --governance`, the
# step below, marks handoff-set, manifest-schema and grounding as `skip`
# WITHOUT evaluating them. Comparing a recorded checksum against the bytes on
# disk is `aahp verify` Layer 1's job; ADR-011 assigns handoff drift to
# `aahp verify`. If this repository also keeps `.ai/handoff/`, add
# `.github/workflows/aahp-verify.yml` beside this file and make it a required
# status check. Without it no gate here compares a handoff checksum, and a green
# conformance record is a statement about conformance, not integrity.
#
# `aahp lint` is not a substitute either, least of all here: its checksum
# comparison runs only under a Python interpreter, and this workflow sets up
# Node and not Python. With no interpreter present lint reports that MANIFEST
# integrity was NOT verified and still exits 0, so it would turn a drifted tree
# green. `aahp verify` Layer 1 fails outright when it has no interpreter.
#
# Prerequisites in the consumer repo:
#   - @elvatis_com/aahp pinned as an exact devDependency (npm i -D -E @elvatis_com/aahp)
#   - a committed package-lock.json (npm ci needs it)
#   - an aahp.config.json (see `aahp init --gates`)
#
# Hardening, and why it is stated here rather than left to the adopting repo:
# AAHP cannot know an adopter's repository visibility, their
# `default_workflow_permissions` setting, or whether an organization default
# grants `write`. So this file declares what it needs instead of inheriting it.
#   - `permissions: contents: read` is the whole grant. This workflow only reads
#     the checkout and runs `aahp` locally; it opens no issue, posts no comment
#     and pushes nothing. Without this block the job inherits the repository
#     default, and in a repository whose default is `write` that hands a
#     write-capable GITHUB_TOKEN to `npm ci` and to everything `aahp` executes.
#   - `persist-credentials: false` keeps that token out of `.git/config`.
#     actions/checkout defaults it to true, which writes the token into the
#     workspace where every later step in the job can read it. Nothing here
#     needs it: the checkout is the only network git operation in the job.
# If you add a step that pushes, revisit both lines deliberately rather than
# deleting them.
name: AAHP Govern

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Node 22 is the floor engines.node publishes for @elvatis_com/aahp.
          # `aahp init --gates` copies this file into a consumer repository
          # byte-identical, so this pin is the runtime every adopting repo runs
          # the gates on. A lower pin does not fail loudly: `npm ci` emits
          # EBADENGINE and carries on, so the CLI then runs on a runtime the
          # package does not claim to support. scripts/check-runtime-support.mjs
          # scans this directory for exactly that reason - see its SCAN_ROOTS.
          node-version: '22'
      - name: Install pinned aahp devDependency
        run: npm ci --ignore-scripts
      - name: Run governance gates
        run: npx --no-install aahp check .
      - name: Governance conformance record
        run: npx --no-install aahp doctor --governance --json .
