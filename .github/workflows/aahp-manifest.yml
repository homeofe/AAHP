name: AAHP Manifest

# `contents: read` is the whole grant this workflow needs: it reads the checkout
# and runs local scripts. Declared rather than inherited, because the inherited
# value is a repository SETTING (default_workflow_permissions) that can widen
# every job in this file with no diff here to review.
#
# The checkout below sets `persist-credentials: false` for the matching reason:
# actions/checkout defaults it to true, which writes the job's GITHUB_TOKEN into
# .git/config where every later step in the job can read it. Nothing here uses
# git credentials.
#
# tests/assert-workflow-hardening.mjs keeps both true.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  aahp-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # see the header
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Validate MANIFEST JSON
        run: python -m json.tool .ai/handoff/MANIFEST.json > /dev/null
      # This job runs no other npm step, so it installs the locked closure
      # itself. --ignore-scripts because nothing here needs a lifecycle hook
      # to run, and the whole point of the step is to execute less foreign code.
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Validate MANIFEST schema
        # `--no-install` is the load-bearing half: without it npx falls back to
        # the registry whenever the local resolution misses, and the pin above
        # buys nothing. scripts/check-workflow-pinning.mjs keeps this shape.
        run: npx --no-install ajv-cli validate --spec=draft2020 -c ajv-formats -s schema/aahp-manifest.schema.json -d .ai/handoff/MANIFEST.json
      - name: Check MANIFEST generator
        run: |
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/.ai"
          cp -R .ai/handoff "$tmpdir/.ai/handoff"
          bash scripts/aahp-manifest.sh "$tmpdir" --quiet --phase implementation
          python -m json.tool "$tmpdir/.ai/handoff/MANIFEST.json" > /dev/null
