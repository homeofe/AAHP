name: AAHP CI

# Two hardening properties hold across this file, and a gate keeps each true.
#
# 1. A declared floor instead of an inherited one. Without a top-level
#    `permissions:` block every job here takes the repository's
#    `default_workflow_permissions`, which is a SETTING: flipping it widens this
#    workflow with no diff here to review. `contents: read` is what the two
#    untagged jobs need, since they only read the checkout and run local
#    scripts. Required by tests/assert-workflow-hardening.mjs.
#
#    The publish and release jobs below carry their own blocks. A job-level
#    `permissions:` REPLACES the top-level one rather than merging with it, so
#    this line does not reduce what they get, and deleting one of their blocks
#    as "redundant" would drop an elevation whose failure only appears on a
#    release tag. Required by tests/assert-repo-ci-shape.mjs.
#
# 2. `persist-credentials: false` on every checkout below. actions/checkout
#    defaults it to true, which writes the job's GITHUB_TOKEN into .git/config
#    where every later step in the job can read it, including anything a
#    dependency lifecycle script runs. No job in this workflow needs it: the
#    release job authenticates `gh` through GH_TOKEN in the environment, and
#    publish authenticates to npm by OIDC. Required by
#    tests/assert-workflow-hardening.mjs.
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # see the header

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The floor engines.node publishes. runtime-matrix below exercises
          # the rest of the published range; this job is the required check,
          # so its name must stay literal - a matrix here would rename it to
          # "lint-and-validate (22)" and the required context would never
          # report again, blocking every pull request.
          node-version: '22'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck scripts
        run: |
          # Shellcheck every tracked shell script + git hook. A glob (not a
          # hand-maintained list) means new scripts are covered automatically -
          # the old list had already missed scripts/propagate.sh.
          mapfile -t sh_files < <(git ls-files '*.sh' '*.bash' 'scripts/hooks/*')
          printf '  shellcheck: %s\n' "${sh_files[@]}"
          shellcheck -x -P scripts/ "${sh_files[@]}"

      - name: Compile Python validators
        run: python -m py_compile scripts/validate-pii-allowlist.py

      - name: Lint handoff files
        run: bash scripts/lint-handoff.sh .

      - name: Validate MANIFEST.json against schema
        # ajv-cli and ajv-formats are exact devDependencies, so the `npm ci`
        # step above already installed the locked closure and there is nothing
        # left to fetch here. `--no-install` is the load-bearing half: without
        # it npx falls back to the registry whenever the local resolution
        # misses, and the pin upstream buys nothing.
        # scripts/check-workflow-pinning.mjs keeps this shape.
        run: npx --no-install ajv-cli validate --spec=draft2020 -c ajv-formats -s schema/aahp-manifest.schema.json -d .ai/handoff/MANIFEST.json

      - name: Validate aahp.config.json against schema
        # This repository ships schema/aahp-config.schema.json to adopters and
        # never applied it to its own config, so it did not dogfood the file
        # through which every gate is switched on. Two validators run over it:
        # AJV here (the reference implementation, and the one that would catch a
        # bug in ours), and the dependency-free scripts/aahp-schema.mjs that
        # ships inside the package and runs at gate time on a consumer machine
        # where AJV is not installed. A disagreement between them is itself a
        # finding, which is why both run rather than only the cheaper one.
        run: npx --no-install ajv-cli validate --spec=draft2020 -c ajv-formats -s schema/aahp-config.schema.json -d aahp.config.json -d aahp.config.example.json

      - name: Syntax-check Node gates
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done

      - name: Run release gates (changelog, version-sync, claims, handoff)
        run: npm run check

      - name: Run aahp doctor (conformance)
        run: npm run doctor

      - name: Run bats tests
        run: npm test

  runtime-matrix:
    # Exercise the WHOLE range engines.node publishes, not just its floor.
    # scripts/check-runtime-support.mjs binds this matrix directly: emptying
    # it or cutting it to one entry turns that gate red, because the standalone
    # pins in the other jobs would otherwise keep a global pin list populated
    # and hide the loss of coverage.
    #
    # Only the Node-sensitive surface runs here. shellcheck, the Python
    # validators and ajv do not vary by Node major, so lint-and-validate keeps
    # them and this job does not repeat them.
    name: Runtime matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # see the header
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: npm ci
      - name: Syntax-check Node gates
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Assert the runtime relation holds on this runtime too
        run: npm run check:runtime-support
      - name: Run aahp doctor (conformance)
        run: npm run doctor
      - name: Run bats tests
        run: npm test

  publish:
    name: Publish to npm
    # Both gates, so a release cannot ship past a red runtime matrix.
    needs: [lint-and-validate, runtime-matrix]
    runs-on: ubuntu-latest
    # Release authorization. This condition has two top-level operands and they
    # are different kinds of thing.
    #
    # The first is the shared definition of "this ref is a release". It is
    # byte-identical to the `release` job's condition below, and
    # tests/assert-repo-ci-shape.mjs holds the two together, so they cannot
    # drift apart unnoticed the way they did before.
    #
    # The second is a standing permission to publish on something that is not a
    # release: a manual run publishes from whichever ref it was started on, with
    # no tag and no GitHub Release. Whether that path should exist at all is an
    # OPEN owner decision, recorded with its options in ADR-019 in README.md and
    # tracked at https://github.com/homeofe/AAHP/issues/69. Until it is settled,
    # the same assertion pins this condition exactly as written, so any edit to
    # it must update the record in the same commit.
    if: (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # see the header
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24: OIDC trusted publishing needs a recent npm, and npm@latest
          # (>=12) requires Node >=22. Node 20 broke the upgrade step below.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm (OIDC trusted publishing, no token)
        run: npm publish --access public --provenance

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    # The shared release definition, byte-identical to the first operand of the
    # publish condition above. Asserted by tests/assert-repo-ci-shape.mjs.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # see the header
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "AAHP $GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME. See CHANGELOG.md for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
